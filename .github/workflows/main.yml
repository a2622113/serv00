name: Serv00 Keep Alive (Multi Account)

on:
  schedule:
    - cron: '0 3 1,16 * *'
  workflow_dispatch:          

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SERV00_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERV00_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Keep All Accounts Alive
        env:
          HOST: ${{ secrets.SERV00_HOST }}
          USERS: ${{ secrets.SERV00_USERS }}
        run: |
          IFS=',' read -ra USER_ARRAY <<< "$USERS"
          for USERNAME in "${USER_ARRAY[@]}"; do
            echo "==> Keepalive for $USERNAME@$HOST"
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$USERNAME@$HOST" "echo KeepAlive Success" && echo "✅ $USERNAME OK" || echo "❌ $USERNAME FAILED"
          done
